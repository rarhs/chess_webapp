<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15171B">
  <title>Chess</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23F2B544' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M8 20h8M9 16h6l1 4H8l1-4zM10 16l-1-6h6l-1 6M9 10a3 3 0 1 1 6 0M12 4v3M10.5 5.5h3'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#F2B544" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 20h8M9 16h6l1 4H8l1-4zM10 16l-1-6h6l-1 6M9 10a3 3 0 1 1 6 0M12 4v3M10.5 5.5h3"/></svg>
      <span>Chess</span>
    </div>
    <div class="topbar-right">
      <span class="chip" id="mode-chip"></span>
      <button type="button" class="btn primary" id="btn-new">New game</button>
    </div>
  </header>

  <main class="layout">
    <section class="play" aria-label="Board">
      <div class="play-inner">
        <div class="player" id="player-top"></div>
        <div class="status" id="status" role="status" aria-live="polite"></div>
        <div class="board-wrap">
          <div id="board"></div>
        </div>
        <div class="player" id="player-bottom"></div>
      </div>
    </section>

    <aside class="panel" aria-label="Game panel">
      <div class="controls">
        <button type="button" class="btn" id="btn-undo">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>Undo</button>
        <button type="button" class="btn" id="btn-flip">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>Flip board</button>
        <button type="button" class="btn" id="btn-draw">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12h8M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z"/></svg>Offer draw</button>
        <button type="button" class="btn danger" id="btn-resign">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>Resign</button>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>Moves</h2>
          <span class="muted" id="ply-info"></span>
        </div>
        <ol class="moves" id="moves" aria-label="Move list"></ol>
        <div class="nav">
          <button type="button" class="icon-btn" id="nav-first" aria-label="First position"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 17l-5-5 5-5M11 17l-5-5 5-5"/></svg></button>
          <button type="button" class="icon-btn" id="nav-prev" aria-label="Previous move"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
          <button type="button" class="icon-btn" id="nav-next" aria-label="Next move"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
          <button type="button" class="icon-btn" id="nav-last" aria-label="Current position"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 17l5-5-5-5M13 17l5-5-5-5"/></svg></button>
        </div>
      </div>

      <div class="card pad">
        <h2>Position</h2>
        <label for="fen" class="muted small">FEN</label>
        <div class="row">
          <input id="fen" readonly spellcheck="false">
          <button type="button" class="icon-btn" id="btn-copy-fen" aria-label="Copy FEN"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button>
        </div>
        <div class="row wrap">
          <button type="button" class="btn" id="btn-export">Export PGN</button>
          <button type="button" class="btn" id="btn-import">Import PGN / FEN</button>
        </div>
        <dl class="facts">
          <dt>Fifty-move counter</dt><dd id="fact-fifty"></dd>
          <dt>Position repeated</dt><dd id="fact-rep"></dd>
          <dt>Castling rights</dt><dd id="fact-castle"></dd>
        </dl>
        <div class="row between">
          <label for="theme" class="muted small">Board colours</label>
          <select id="theme">
            <option value="slate">Slate</option>
            <option value="green">Green</option>
            <option value="walnut">Walnut</option>
          </select>
        </div>
        <label class="check-row"><input type="checkbox" id="opt-hints" checked> Highlight legal moves</label>
      </div>
    </aside>
  </main>

  <dialog id="dlg-new" aria-labelledby="ng-title">
    <form method="dialog" class="dlg">
      <h2 id="ng-title">New game</h2>
      <fieldset>
        <legend>Opponent</legend>
        <div class="seg cols-2">
          <label><input type="radio" name="mode" value="human"><span>Two players, this device</span></label>
          <label><input type="radio" name="mode" value="computer" checked><span>Computer</span></label>
        </div>
      </fieldset>
      <fieldset id="fs-level">
        <legend>Difficulty</legend>
        <div class="seg cols-4" id="level-options"></div>
      </fieldset>
      <fieldset id="fs-side">
        <legend>Play as</legend>
        <div class="seg cols-3">
          <label><input type="radio" name="side" value="w" checked><span>White</span></label>
          <label><input type="radio" name="side" value="random"><span>Random</span></label>
          <label><input type="radio" name="side" value="b"><span>Black</span></label>
        </div>
      </fieldset>
      <div class="row between">
        <label for="clock">Clock</label>
        <select id="clock" name="clock">
          <option value="">No clock</option>
          <option value="300+0">5 min</option>
          <option value="600+5">10 min + 5 s</option>
          <option value="900+10">15 min + 10 s</option>
        </select>
      </div>
      <div class="dlg-actions">
        <button type="submit" value="cancel" class="btn ghost">Cancel</button>
        <button type="submit" value="start" class="btn primary">Start game</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-import" aria-labelledby="im-title">
    <form method="dialog" class="dlg">
      <h2 id="im-title">Import a game</h2>
      <div class="tabs" role="tablist" aria-label="Format">
        <button type="button" role="tab" id="tab-pgn" aria-selected="true">PGN</button>
        <button type="button" role="tab" id="tab-fen" aria-selected="false">FEN</button>
      </div>
      <label for="import-text" class="muted small" id="import-label">Paste PGN or choose a .pgn file</label>
      <textarea id="import-text" rows="8" spellcheck="false"></textarea>
      <div class="alert" id="import-error" role="alert" hidden></div>
      <div class="dlg-actions between">
        <label class="btn ghost file-btn">Choose file…<input type="file" id="import-file" accept=".pgn,.txt,.fen,text/plain"></label>
        <div class="row">
          <button type="submit" value="cancel" class="btn ghost">Cancel</button>
          <button type="button" class="btn primary" id="btn-import-load">Load game</button>
        </div>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-over" aria-labelledby="go-title">
    <form method="dialog" class="dlg">
      <div class="over-head">
        <div>
          <span class="muted small">Game over</span>
          <h2 id="go-title"></h2>
          <span class="muted" id="go-final"></span>
        </div>
        <span class="score" id="go-score"></span>
      </div>
      <div class="dlg-actions start">
        <button type="button" class="btn primary" id="go-new">New game</button>
        <button type="submit" value="review" class="btn">Review moves</button>
        <button type="button" class="btn" id="go-export">Export PGN</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-confirm" aria-labelledby="cf-title">
    <form method="dialog" class="dlg narrow">
      <h2 id="cf-title"></h2>
      <p id="cf-body" class="muted"></p>
      <div class="dlg-actions">
        <button type="submit" value="no" class="btn ghost" id="cf-no">Cancel</button>
        <button type="submit" value="yes" class="btn primary" id="cf-yes">OK</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
